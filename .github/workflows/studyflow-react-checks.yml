name: StudyFlow React checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'next/**'
      - '.github/workflows/studyflow-react-checks.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'next/**'
      - '.github/workflows/studyflow-react-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Validate public study data
        run: pnpm --dir app validate:data
      - name: Run unit tests
        run: pnpm --dir app test
      - name: Build preview
        run: pnpm --dir app build
      - name: Ensure the published preview is current
        run: git diff --exit-code -- next
